<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تَذَكَّر | Tathakkar</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ألوان الموقع الأساسية (بدون أصفر/ليموني) */
            --bg-color: #F8F9FA;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
            --header-bg: rgba(255, 255, 255, 0.9);
            --card-glass: rgba(255, 255, 255, 0.8);
            --border-color: #E0E6ED;
            --primary: #3498DB; 
            --accent: #E74C3C;
        }

        [data-theme="dark"] {
            --bg-color: #1A1A2E;
            --text-main: #F5F6FA;
            --text-muted: #A4B0BE;
            --header-bg: rgba(26, 26, 46, 0.9);
            --card-glass: rgba(255, 255, 255, 0.05);
            --border-color: #2F3640;
            --primary: #4CD137;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* --- الشاشة الافتتاحية --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(135deg, #2C3E50, #34495E);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #splash h1 { font-size: 4rem; color: #FFF; font-weight: 900; animation: pulse 1.5s infinite alternate; }
        .quran-verse { font-family: 'Amiri', serif; color: rgba(255,255,255,0.7); font-size: 1.2rem; position: absolute; bottom: 40px; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* --- الشريط العلوي (حسب الرسمة) --- */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); z-index: 10;
        }
        .icon-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; }
        header h1 { font-size: 1.8rem; font-weight: 900; color: var(--primary); margin: 0; }

        /* --- تحدي الأسبوع --- */
        .weekly-banner {
            background: linear-gradient(to right, #74ebd5, #ACB6E5); color: #2C3E50;
            text-align: center; padding: 8px; font-size: 0.9rem; font-weight: 700;
        }

        /* --- منطقة المحتوى (الشبكة) --- */
        main { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
        .posts-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* عمودين كما في الرسمة */
            gap: 15px; 
            max-width: 800px; margin: 0 auto;
        }

        /* --- بطاقة السُنة (حسب الرسمة) --- */
        .post-card {
            background: var(--card-glass); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 15px; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #2C3E50;
        }
        .post-card[data-dark="true"] { color: #FFF; }
        .card-icon { width: 35px; height: 35px; border-radius: 8px; background: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 10px; }
        .card-text { font-family: 'Amiri', serif; font-size: 1.1rem; line-height: 1.5; flex: 1; margin-bottom: 10px; word-break: break-word; }
        .card-signature { font-size: 0.85rem; font-weight: 700; text-align: left; margin-bottom: 10px; opacity: 0.8; font-family: 'Tajawal', sans-serif;}
        .card-actions { display: flex; justify-content: space-between; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 10px; }
        .action-btn { background: none; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; color: inherit; opacity: 0.9;}

        /* --- الشريط السفلي (التنقل والإضافة) --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--header-bg); backdrop-filter: blur(15px); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; padding: 10px 20px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 20;
        }
        .nav-item { background: none; border: 1px solid var(--text-muted); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-main); cursor: pointer; }
        .nav-item.active { border-color: var(--primary); color: var(--primary); background: rgba(52, 152, 219, 0.1); }
        .nav-fab { width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 2rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); cursor: pointer; transform: translateY(-5px); }

        /* --- النوافذ المنبثقة (Modals) --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-color); width: 100%; max-width: 500px; border-radius: 20px; padding: 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .close-modal { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; }
        
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; color: var(--text-main); text-align: center;}
        .form-input { width: 100%; background: var(--header-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 1rem; outline: none; }
        textarea.form-input { font-family: 'Amiri', serif; font-size: 1.2rem; resize: none; }
        
        /* خيارات الألوان اللطيفة (الباستيل) */
        .options-row { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .color-dot { min-width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: var(--text-main); transform: scale(1.1); }
        .emoji-btn { min-width: 35px; text-align: center; font-size: 1.5rem; cursor: pointer; opacity: 0.5; }
        .emoji-btn.active { opacity: 1; transform: scale(1.2); }
        
        .submit-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; }

        /* نافذة سُنة اليوم */
        #dailyPopup .modal-content { text-align: center; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #fff; }
        #dailyPopup h2 { margin-bottom: 10px; font-weight: 900; }
        #dailyPopup p { font-family: 'Amiri', serif; font-size: 1.4rem; line-height: 1.6; }

        @media (min-width: 768px) { .posts-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body data-theme="light">

    <!-- الشاشة الافتتاحية -->
    <div id="splash">
        <h1>تَذَكَّر</h1>
        <p class="quran-verse">(فَذَكِّرْ إِنَّ الذِّكْرَى تَنفَعُ الْمُؤْمِنِينَ)</p>
    </div>

    <!-- الشريط العلوي -->
    <header>
        <button class="icon-btn" onclick="toggleTheme()">☰</button>
        <h1>تَذَكَّر</h1>
        <button class="icon-btn" onclick="showDailyPopup()">🔔</button>
    </header>

    <!-- تحدي الأسبوع -->
    <div class="weekly-banner">
        🎯 تحدي الأسبوع: إحياء سُنة "التبسم" في وجوه الطالبات والمعلمات
    </div>

    <!-- المحتوى الرئيسي (الشبكة) -->
    <main>
        <div id="postsContainer" class="posts-grid"></div>
    </main>

    <!-- الشريط السفلي الدائري -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('home')">🏠</button>
        <button class="nav-fab" onclick="openModal('addModal')">➕</button>
        <button class="nav-item" onclick="switchView('leaderboard')">🏆</button>
    </nav>

    <!-- نافذة الإضافة -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('addModal')">×</button>
            <h2 class="modal-title">أضف سُنة مهجورة ✨</h2>
            <form onsubmit="addPost(event)">
                <input type="text" id="authorInput" class="form-input" placeholder="اسمك أو اللقب" required>
                <textarea id="textInput" class="form-input" rows="3" placeholder="اكتب السُنة هنا..." required></textarea>
                
                <label style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; display: block;">اختر لوناً لطيفاً للمنشور:</label>
                <div class="options-row" id="colorPicker">
                    <!-- ألوان باستيل مريحة وفاتحة مع وجود الأصفر كخيار فقط هنا -->
                    <div class="color-dot active" style="background: #F8F9FA;" data-color="#F8F9FA" data-dark="false"></div> <!-- أبيض/رمادي فاتح -->
                    <div class="color-dot" style="background: #FFF3CD;" data-color="#FFF3CD" data-dark="false"></div> <!-- أصفر ليموني فاتح جداً -->
                    <div class="color-dot" style="background: #D1F2EB;" data-color="#D1F2EB" data-dark="false"></div> <!-- نعناعي فاتح -->
                    <div class="color-dot" style="background: #FADBD8;" data-color="#FADBD8" data-dark="false"></div> <!-- وردي باستيل -->
                    <div class="color-dot" style="background: #D6EAF8;" data-color="#D6EAF8" data-dark="false"></div> <!-- أزرق سماوي -->
                    <div class="color-dot" style="background: #E8DAEF;" data-color="#E8DAEF" data-dark="false"></div> <!-- لافندر -->
                </div>

                <label style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; display: block;">اختر رمزاً:</label>
                <div class="options-row" id="emojiPicker">
                    <div class="emoji-btn active" data-emoji="🌸">🌸</div>
                    <div class="emoji-btn" data-emoji="🌿">🌿</div>
                    <div class="emoji-btn" data-emoji="✨">✨</div>
                    <div class="emoji-btn" data-emoji="👑">👑</div>
                    <div class="emoji-btn" data-emoji="💡">💡</div>
                </div>

                <button type="submit" class="submit-btn">نشر السُنة 🚀</button>
            </form>
        </div>
    </div>

    <!-- نافذة سُنة اليوم -->
    <div class="modal-overlay" id="dailyPopup">
        <div class="modal-content" style="position: relative;">
            <button class="close-modal" style="color: #fff;" onclick="closeModal('dailyPopup')">×</button>
            <h2>سُنة اليوم 💡</h2>
            <p>سُنة نفض الفراش قبل النوم وتسمية الله (بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي..)</p>
            <button onclick="closeModal('dailyPopup')" style="margin-top: 15px; background: rgba(0,0,0,0.2); color: #fff; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer;">تم التطبيق ✅</button>
        </div>
    </div>

    <script>
        let selectedColor = '#F8F9FA';
        let selectedEmoji = '🌸';
        let isDarkText = false;
        let posts = JSON.parse(localStorage.getItem('tathakkar_v3')) || [];

        // إخفاء الشاشة الافتتاحية تلقائياً بعد 3 ثواني
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
                
                // إظهار نافذة سُنة اليوم إن لم تظهر مسبقاً
                if(!sessionStorage.getItem('dailyShown')) {
                    setTimeout(showDailyPopup, 1000);
                    sessionStorage.setItem('dailyShown', 'true');
                }
            }, 3000); 
        });

        // النوافذ المنبثقة
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showDailyPopup() { openModal('dailyPopup'); }

        // التبديل بين الأقسام
        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(view === 'home') renderPosts();
            if(view === 'leaderboard') renderLeaderboard();
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        // تفاعلات الألوان والرموز
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', function() {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                selectedColor = this.getAttribute('data-color');
                isDarkText = this.getAttribute('data-dark') === 'true';
            });
        });
        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedEmoji = this.getAttribute('data-emoji');
            });
        });

        // النشر
        function addPost(e) {
            e.preventDefault();
            const author = document.getElementById('authorInput').value;
            const text = document.getElementById('textInput').value;
            posts.unshift({ id: Date.now(), author, text, color: selectedColor, emoji: selectedEmoji, likes: 0, dark: isDarkText });
            localStorage.setItem('tathakkar_v3', JSON.stringify(posts));
            closeModal('addModal');
            document.querySelector('form').reset();
            switchView('home');
        }

        function likePost(id) {
            const post = posts.find(p => p.id === id);
            if (post) { post.likes++; localStorage.setItem('tathakkar_v3', JSON.stringify(posts)); renderPosts(); }
        }

        function sharePost(text, author) {
            if (navigator.share) {
                navigator.share({ title: 'سُنة مهجورة', text: `${text} \n- بواسطة: ${author} \nشاركونا الأجر عبر موقع تَذَكَّر ✨`});
            } else { alert('تم نسخ النص للمشاركة!'); }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = posts.length === 0 ? '<p style="text-align:center; margin-top:50px; color:var(--text-muted); grid-column:1/-1;">لا توجد مشاركات بعد. اضغطي (+) للبدء!</p>' : '';
            
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.style.background = post.color;
                // لون النص يتغير ليناسب لون الخلفية الفاتح
                const textColor = '#2C3E50'; 
                card.style.color = textColor;

                card.innerHTML = `
                    <div class="card-icon">${post.emoji}</div>
                    <div class="card-text">${post.text}</div>
                    <div class="card-signature">✍️ ${post.author}</div>
                    <div class="card-actions" style="border-top-color: rgba(0,0,0,0.1)">
                        <button class="action-btn" onclick="likePost(${post.id})">❤️ ${post.likes}</button>
                        <button class="action-btn" onclick="sharePost('${post.text}', '${post.author}')">🔗 شارك</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderLeaderboard() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; margin-bottom:20px;">🏆 لوحة متصدري الأثر</h2>';
            const sorted = [...posts].sort((a, b) => b.likes - a.likes).slice(0, 10);
            
            sorted.forEach((post, index) => {
                const div = document.createElement('div');
                div.style = 'grid-column:1/-1; background:var(--card-glass); padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; border:1px solid var(--border-color);';
                div.innerHTML = `<div><strong>#${index+1} ${post.author}</strong> <span style="font-size:0.8rem; color:var(--text-muted); display:block;">${post.text.substring(0,30)}...</span></div> <div style="color:var(--accent); font-weight:bold;">❤️ ${post.likes}</div>`;
                container.appendChild(div);
            });
        }

        // تشغيل أولي
        renderPosts();
    </script>
</body>
</html>
